<!-- ZOOMO animated logo: paste this block anywhere in your page. Transparent background. -->
<div id="zoomo-logo" tabindex="0" role="img" aria-label="ZOOMO animated logo" style="width:360px;max-width:100%;cursor:pointer;outline:none;background:transparent">
<svg viewBox="0 0 360 190" style="width:100%;height:100%;display:block;overflow:hidden">
<style>
#zoomo-logo .o{stroke:#1B1B3A;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
#zoomo-logo .veh{transform:translateX(-420px);transition:transform .8s cubic-bezier(.5,0,.3,1)}
#zoomo-logo .veh.on{transform:none}
#zoomo-logo .veh.out{transform:translateX(420px)}
#zoomo-logo .wheel{transform-box:fill-box;transform-origin:center;animation:zl-spin .5s linear infinite}
#zoomo-logo .bob{animation:zl-bob .35s ease-in-out infinite alternate}
#zoomo-logo .puff{transform-box:fill-box;transform-origin:center;fill:#E3D9C8;stroke:#1B1B3A;stroke-width:2;opacity:0;animation:zl-puff 1.2s ease-out infinite}
#zoomo-logo .road{animation:zl-road .5s linear infinite}
@keyframes zl-spin{to{transform:rotate(360deg)}}
@keyframes zl-bob{to{transform:translateY(-2px)}}
@keyframes zl-puff{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:.9}100%{opacity:0;transform:translate(-46px,-18px) scale(1.8)}}
@keyframes zl-road{to{stroke-dashoffset:32}}
@media (prefers-reduced-motion:reduce){#zoomo-logo .wheel,#zoomo-logo .puff,#zoomo-logo .road,#zoomo-logo .bob{animation:none}#zoomo-logo .veh{transition:none!important}}
html,body{margin:0;width:100%;height:100%;overflow:hidden}#zoomo-logo{margin:0!important;max-width:none!important}
</style>

<script>
(function(){
var root=document.getElementById('zoomo-logo'),vs=root.querySelectorAll('.veh'),i=0,lock=false;
root.style.width='100%';root.style.height='100%';
vs[0].classList.add('on');
function next(){
  if(lock)return;lock=true;
  var a=vs[i];i=(i+1)%vs.length;var b=vs[i];
  b.classList.add('on');a.classList.remove('on');a.classList.add('out');
  setTimeout(function(){a.style.transition='none';a.classList.remove('out');void a.getBoundingClientRect();a.style.transition='';lock=false},900);
}
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){setInterval(next,3200)}
root.addEventListener('mouseenter',next);root.addEventListener('click',next);
root.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}});
})();
</script>
