services:
  - type: web
    name: cabby-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: MAPS_USER_AGENT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zoomo-redis
          property: connectionString
  - type: worker
    name: zoomo-receipt-worker
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks.celery worker --loglevel=INFO --concurrency=2
    envVars:
      - key: SUPABASE_DATABASE_URL
        fromService:
          type: web
          name: cabby-api
          envVarKey: SUPABASE_DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zoomo-redis
          property: connectionString
  - type: keyvalue
    name: zoomo-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []
